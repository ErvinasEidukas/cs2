<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CS2 Maps</title>

    <link rel="icon" type="image/png" href="/../assets/icons/counter-strike-2.png">
    <link rel="stylesheet" href="../css/pages/maps.css">
</head>

<body class="loading">

<header>
    <div class="header-top">
        <a href="../index.html" class="home-link">←</a>
        <h1>CS2 Maps</h1>
        <div class="header-spacer"></div>
    </div>

    <div id="maps-menu">
        <button data-map="mirage">Mirage</button>
        <button data-map="dust2">Dust 2</button>
        <button data-map="ancient">Ancient</button>
        <button data-map="anubis">Anubis</button>
        <button data-map="inferno">Inferno</button>
        <button data-map="nuke">Nuke</button>
        <button data-map="cache">Cache</button>
        <button data-map="vertigo">Vertigo</button>
    </div>
</header>

<main>
    <aside id="controls-panel">
        <div id="callout-controls">
            <h2>Callout Controls</h2>

            <div id="editor-controls">
                <button id="draw-mode">Draw Polygon</button>
                <button id="finish-shape">Finish Shape</button>
            </div>
        </div>

        <div id="lineup-controls" class="hidden">
            <h2>Nade Lineups</h2>

            <div class="control-group">
                <span>Side</span>

                <label>
                    <input
                        type="checkbox"
                        class="nade-side-filter"
                        value="ct"
                        checked
                    >
                    CT
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="nade-side-filter"
                        value="t"
                        checked
                    >
                    T
                </label>
            </div>

            <div class="control-group">
                <span>Grenade types</span>

                <label>
                    <input
                        type="checkbox"
                        class="nade-filter"
                        value="smoke"
                        checked
                    >
                    Smoke
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="nade-filter"
                        value="flash"
                        checked
                    >
                    Flash
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="nade-filter"
                        value="molotov"
                        checked
                    >
                    Molotov
                </label>

                <label>
                    <input
                        type="checkbox"
                        class="nade-filter"
                        value="he"
                        checked
                    >
                    HE
                </label>
            </div>

            <div id="debuts-controls" class="hidden">
                <span>Debuts:</span>
                <div id="debuts-filters"></div>
            </div>

            <div id="lineup-drawing-controls">
                <button id="draw-lineup">Draw Lineup</button>
                <button id="finish-lineup">Finish Lineup</button>
            </div>
        </div>
    </aside>

    <section id="map-section">
        <div id="mode-selector">
            <label>
                <input
                    type="radio"
                    name="display-mode"
                    value="callouts"
                    id="callouts-radio"
                    checked
                >
                <span>Callouts</span>
            </label>

            <label>
                <input
                    type="radio"
                    name="display-mode"
                    value="lineups"
                    id="lineups-radio"
                >
                <span>Nade Lineups</span>
            </label>
        </div>

        <div id="map-container"></div>
    </section>

    <aside id="info-panel">
        <div>
            <h2 id="info-title">Area callout</h2>
            <div id="info-description">Click a position</div>
            <div id="area-description"></div>
            <div id="area-photos"></div>
        </div>
    </aside>
</main>

<script type="module" src="../js/pages/maps/main.js"></script>

</body>
</html>
