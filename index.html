<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Callout Trainer</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>CS2 Callout Trainer</h1>
    </header>

    <main>

        <section id="map-section">

            <svg
                id="map"
                viewBox="0 0 1024 1024"
                preserveAspectRatio="xMidYMid meet">

                <image
                    href="assets/maps/mirage.webp"
                    width="1024"
                    height="1024" />

                    <polygon
                        class="callout"
                        data-id="connector"
                        points="420,380 480,380 500,430 440,450"
                    />
                    <polygon
                        class="callout"
                        data-id="window"
                        points="600,300 660,300 660,360 600,360"
                    />
            </svg>

        </section>

        <aside id="info-panel">

            <h2>Area</h2>

            <h3 id="area-name">
                Select an area
            </h3>

            <p id="description">
                Click an area on the map.
            </p>

        </aside>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
