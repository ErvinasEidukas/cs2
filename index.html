<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Callout Trainer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>
        CS2 Callout Trainer
    </h1>

    <nav id="maps-menu">
        <button data-map="mirage">
            Mirage
        </button>
        <button data-map="dust2">
            dust 2
        </button>
    </nav>
</header>

<main>
    <section id="map-section">
        <div id="map-container">
            <!-- map loads here -->
        </div>
    </section>

    <aside id="info-panel">
        <h2>
            Area
        </h2>

        <h3 id="area-name">
            Select area
        </h3>

        <p id="description">
            Click a position.
        </p>
    </aside>
</main>

<script src="js/app.js"></script>

</body>
</html>
