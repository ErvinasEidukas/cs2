<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Callouts</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

<header>
    <h1>
        CS2 Callouts
    </h1>

    <nav id="maps-menu">
        <button data-map="mirage">
            Mirage
        </button>
        <button data-map="dust2">
            Dust 2
        </button>
    </nav>

    <div id="editor-controls">

        <button id="draw-mode">
            Draw Polygon
        </button>

        <button id="finish-shape">
            Finish Shape
        </button>

    </div>
</header>

<main>
    <section id="map-section">
        <div id="map-container">
            <!-- map loads here -->
        </div>
    </section>

    <aside id="info-panel">
        <h2>
            Area callout
        </h2>

        <h3 id="area-name">
            Click a position
        </h3>

        <h3 id="area-name-ru"></h3>
    </aside>
</main>

<script type="module" src="./js/main.js"></script>

</body>
</html>
